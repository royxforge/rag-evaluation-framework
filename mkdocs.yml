site_name: RAG Evaluation Framework
site_description: Six RAG metrics in one call, plus a confidence score that needs no labels.
site_url: https://royxforge.github.io/rag-evaluation-framework/
repo_url: https://github.com/royxforge/rag-evaluation-framework
repo_name: royxforge/rag-evaluation-framework
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
nav:
  - Overview: index.md
  - Metrics: metrics.md
  - CLI: cli.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
